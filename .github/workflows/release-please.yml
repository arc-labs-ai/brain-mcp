name: Release Please

# Keeps the version, the CHANGELOG and the release tag in step, so none of
# those is a thing anyone has to remember.
#
# On every push to `main`, release-please reads the conventional commits since
# the last release and maintains a single open "Release PR" that accumulates
# them. That PR bumps the version in package.json (and package-lock.json) and
# writes the CHANGELOG. Merging it creates the `vX.Y.Z` tag, which is what `release.yml`
# triggers on to publish.
#
# The PR is the review step. A misconfigured version bump or a wrong changelog
# shows up as a diff to approve, not as a bad release — nothing reaches a
# registry until that PR is merged and the publish workflow's `release`
# environment gate is passed.
#
# This workflow deliberately does NOT publish and holds no registry
# credentials. `release.yml` does that over OIDC; keeping a third-party action
# out of the job that holds the publish identity is the point of the split.

on:
  push:
    branches: [main]
  # Lets a maintainer force a refresh of the Release PR without a new commit.
  workflow_dispatch:

permissions:
  contents: read

# One release PR at a time; a second push supersedes the first rather than
# racing it.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-26.04
    permissions:
      # Create the tag + GitHub Release on merge, and open/update the PR.
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publish the tag this run just created, without depending on which side of
  # the silent `RELEASE_PLEASE_TOKEN || GITHUB_TOKEN` fallback above we landed
  # on. Calling `release.yml` keeps it inside THIS run, where the recursion
  # guard does not apply.
  #
  # The split the header describes is preserved: it is a split between JOBS,
  # not between files. The third-party release-please action still runs in a
  # job with no `id-token: write`, and the job holding the publish identity
  # still runs no third-party action.
  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    # Granted on the CALLING job. A reusable workflow cannot hold more than its
    # caller, and this file's top-level `contents: read` would otherwise cap
    # `id-token: write` away — npm would then see an anonymous publish and
    # answer 404, which reads as "no permission" rather than "no OIDC token".
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
