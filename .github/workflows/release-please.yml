name: Release Please

# Keeps the version, the CHANGELOG and the release tag in step, so none of
# those is a thing anyone has to remember.
#
# On every push to `main`, release-please reads the conventional commits since
# the last release and maintains a single open "Release PR" that accumulates
# them. That PR bumps the version in package.json (and package-lock.json) and
# writes the CHANGELOG. Merging it creates the `vX.Y.Z` tag, which is what `release.yml`
# triggers on to publish.
#
# The PR is the review step. A misconfigured version bump or a wrong changelog
# shows up as a diff to approve, not as a bad release — nothing reaches a
# registry until that PR is merged and the publish workflow's `release`
# environment gate is passed.
#
# This workflow deliberately does NOT publish and holds no registry
# credentials. `release.yml` does that over OIDC; keeping a third-party action
# out of the job that holds the publish identity is the point of the split.
#
# Publishing is reached ONLY by the tag, never from inside this run. npm's
# trusted publisher is registered against `release.yml` as the entry workflow,
# and a reusable call made from here would carry THIS file as the run's entry
# — npm reads that as an untrusted publish, answers `404 PUT`, and the release
# goes out from the tag path anyway, so the second attempt can only ever fail.
#
# That makes `RELEASE_PLEASE_TOKEN` load-bearing: a tag created with the
# default `GITHUB_TOKEN` does not trigger another workflow. The token below
# therefore has NO fallback — an unset secret fails this workflow, which is
# the only signal anyone gets before tags start piling up unpublished.

on:
  push:
    branches: [main]
  # Lets a maintainer force a refresh of the Release PR without a new commit.
  workflow_dispatch:

permissions:
  contents: read

# One release PR at a time; a second push supersedes the first rather than
# racing it.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-26.04
    permissions:
      # Create the tag + GitHub Release on merge, and open/update the PR.
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # No fallback to GITHUB_TOKEN, deliberately. Events raised with
          # the default token do not start workflow runs, so a tag cut with
          # it is a tag nothing publishes — and a silent fallback makes that
          # look like a healthy release. An unset secret fails this step
          # instead, which is the only way anyone finds out in time.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
