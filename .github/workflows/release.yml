name: Release

# Publishes a release when a version tag is pushed: the npm package, and the
# multi-arch container image on ghcr.io. One workflow, so a release either
# succeeded or did not — there is no second run to go and check.
#
# The tag normally comes from `release-please.yml`, not from a shell: merging
# the Release PR it maintains bumps the version in package.json, writes the
# CHANGELOG, and creates the tag. Tagging by hand still works and is the
# escape hatch:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The version check below is what makes both paths safe — a tag that disagrees
# with package.json cannot publish.
#
# Auth is OIDC **Trusted Publishing** — no NPM_TOKEN lives in this repo. The
# job exchanges the workflow's short-lived GitHub OIDC identity for a scoped,
# single-use publish credential, and npm attaches build provenance
# automatically. This is why it requests `id-token: write`.
#
# ONE-TIME registry setup (done on npmjs.com, not here) — register this repo +
# this workflow as a Trusted Publisher:
#   npmjs.com → package → Settings → Trusted Publisher → GitHub Actions:
#     owner arc-labs-ai, repo brain-mcp, workflow release.yml
# The package is scoped (@brain-db) and `publishConfig.access` is already
# "public", so the first publish creates it as a public scoped package. Until
# the trusted publisher is configured the publish step fails closed (it never
# falls back to a token).
#
# The `release` environment gates the publish; require reviewers on it
# (Settings → Environments → release) to add a manual approval before anything
# goes public.

on:
  push:
    tags:
      - "v*"

  # For a tag that was cut but never published. `ref: inputs.tag || github.ref`
  # means dispatching from `main` runs the CURRENT workflow file against the
  # TAG's source, so a fix here can publish a tag made before the fix existed.
  # Force-moving the tag would also work and is worse: it rewrites history a
  # registry may already reference.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. "v0.4.0"'
        required: true
        type: string

# No repo-wide write; the job opts into `id-token: write` for OIDC.
permissions:
  contents: read

# Both image jobs resolve the same repository.
env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/brain-mcp

jobs:
  npm:
    name: Publish → npm
    runs-on: ubuntu-26.04
    environment: release
    # One publish of a given version at a time. The tag fires this once, and
    # the dispatch escape hatch can fire it again for a tag that already
    # shipped; keyed on the ref so those two queue rather than race.
    #
    # `cancel-in-progress: false`, emphatically: cancelling a publish
    # mid-flight is how a half-uploaded version happens.
    concurrency:
      group: publish-npm-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC → npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 ships an
      # older bundled npm, so upgrade before publishing.
      - name: Upgrade npm (trusted-publishing support)
        run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          RAW="${{ inputs.tag || github.ref_name }}"
          TAG="${RAW#v}"
          VER="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package=$VER"
          test "$TAG" = "$VER" || { echo "::error::tag $TAG != package version $VER"; exit 1; }

      # Is this version already on npm?
      #
      # A dispatch re-run of a tag that already shipped would otherwise reach
      # `npm publish`, npm would refuse a version that exists, and a release
      # that actually shipped would end red — which teaches people to ignore a
      # red release workflow, and that is worse than the duplicate.
      #
      # An already-published version is the state we wanted, so it is success.
      # `npm view` exits non-zero when the version does not exist, which is the
      # ordinary case, hence `|| true`.
      - name: Skip if this version is already published
        id: published
        run: |
          set -uo pipefail
          VER="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          FOUND="$(npm view "$NAME@$VER" version 2>/dev/null || true)"
          if [ "$FOUND" = "$VER" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VER is already on npm - nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VER is not on npm yet - publishing."
          fi

      - if: steps.published.outputs.already != 'true'
        run: npm ci

      - name: Test
        if: steps.published.outputs.already != 'true'
        run: npm test

      - name: Build
        if: steps.published.outputs.already != 'true'
        run: npm run build

      # OIDC trusted publishing: no NODE_AUTH_TOKEN. npm detects the trusted
      # publisher and attaches provenance automatically.
      # Publish, and treat "someone else just published it" as success.
      #
      # The pre-check above closes the SEQUENTIAL duplicate: a run that starts
      # after another finished sees the version and skips. The `concurrency`
      # group serialises overlapping runs so that holds. This block is the
      # belt to those braces — if two ever do overlap, the question asked is
      # still "is the version on npm", not "did my process win the race".
      - name: Publish
        if: steps.published.outputs.already != 'true'
        run: |
          set -uo pipefail
          if npm publish; then
            exit 0
          fi
          VER="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          FOUND="$(npm view "$NAME@$VER" version 2>/dev/null || true)"
          if [ "$FOUND" = "$VER" ]; then
            echo "::notice::$NAME@$VER was published by another run while this one was working - treating as success."
            exit 0
          fi
          echo "::error::npm publish failed and $NAME@$VER is still not on the registry."
          exit 1

  image-build:
    name: Build image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      packages: write # push the per-platform image by digest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          # On a tag push this is already the tag; on a manual dispatch
          # github.ref is the branch the hatch was fired from, so the tag the
          # operator named is what must be built.
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive platform tag pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The merge job runs metadata-action too, but only to tag the manifest
      # LIST. Labels live in each platform image's own config, so they have to
      # be applied here or the published image carries none — in particular
      # `source`, which is what ties a package back to a commit.
      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # This image's whole reason for existing is that one deployment serves
      # many users and each arrives as themselves. That property lives in the
      # request path, not in the unit tests, so it is asserted here against
      # the artifact that is about to be published.
      #
      # The backend is pointed at the discard port: nothing in this job should
      # reach the network, and every assertion below is about what the server
      # does BEFORE it calls a backend.
      - name: Smoke-test the pushed image
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          echo "::group::starting $IMG"
          docker run -d --name smoke -p 3333:3333 \
            -e BRAIN_MCP_BACKEND_URL=http://127.0.0.1:9 \
            "$IMG"
          echo "::endgroup::"

          # The image declares its own HEALTHCHECK (curl /healthz), so waiting
          # on Docker's verdict proves curl is actually in the image. That is
          # not cosmetic: our ECS task definition hardcodes `curl -f` as the
          # container health check, and an image without curl fails every
          # probe and is killed and replaced forever, which reads as the app
          # being broken rather than as a missing package.
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke 2>/dev/null || echo missing)"
            [ "$status" = "healthy" ] && break
            if [ "$(docker inspect -f '{{.State.Status}}' smoke 2>/dev/null)" != "running" ]; then
              echo "::error title=Smoke test failed::container exited before becoming healthy"
              docker logs smoke; docker rm -f smoke; exit 1
            fi
            sleep 2
          done

          if [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" != "healthy" ]; then
            echo "::error title=Smoke test failed::never became healthy within 60s"
            docker inspect -f '{{range .State.Health.Log}}{{.Output}}{{end}}' smoke || true
            docker logs smoke; docker rm -f smoke; exit 1
          fi

          fail() { echo "::error title=Smoke test failed::$1"; docker logs smoke; docker rm -f smoke; exit 1; }

          # 1. /healthz is unauthenticated on purpose — a load balancer has no
          #    bearer to send. If this ever required one, every task would be
          #    marked unhealthy on deploy.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3333/healthz)"
          [ "$code" = "200" ] || fail "/healthz returned $code, want 200"

          # 2. The guard. A request with no credential must be refused at the
          #    door, not served as somebody. This is the failure that would be
          #    invisible in production, because it looks exactly like success.
          out="$(curl -s -D - -o /tmp/body.json -X POST http://127.0.0.1:3333/mcp \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}')"
          grep -qiE '^HTTP/[0-9.]+ 401' <<<"$out" || fail "unauthenticated POST /mcp was not 401: $(head -1 <<<"$out")"
          grep -qi '^www-authenticate: *Bearer' <<<"$out" || fail "401 did not carry a WWW-Authenticate: Bearer challenge"
          grep -q 'Missing Authorization header' /tmp/body.json || fail "401 body did not explain the missing header"

          # 3. A credentialed request is accepted. `initialize` is answered by
          #    the server itself, so this isolates "the bearer is taken" from
          #    "the backend is reachable" — which, here, it deliberately isn't.
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3333/mcp \
                  -H 'Authorization: Bearer brain_smoke_not_a_real_key' \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}')"
          [ "$code" = "200" ] || fail "credentialed initialize returned $code, want 200"

          # 4. No credential is baked into the image. A key in ENV or in a
          #    layer would be ambient authority that survives every deploy.
          if docker inspect -f '{{json .Config.Env}}' "$IMG" | grep -q 'BRAIN_MCP_API_KEY'; then
            fail "the image bakes in BRAIN_MCP_API_KEY"
          fi
          if docker run --rm --entrypoint sh "$IMG" -c 'grep -rlI "brain_" /app/dist /app/package.json 2>/dev/null' | grep -q .; then
            fail "a literal brain_ credential appears in the shipped files"
          fi

          # 5. Not root, and no dev toolchain riding along in node_modules.
          uid="$(docker exec smoke id -u)"
          [ "$uid" != "0" ] || fail "container runs as root"
          if docker run --rm --entrypoint sh "$IMG" -c '[ -d /app/node_modules/typescript ] || [ -d /app/node_modules/vitest ]'; then
            fail "dev dependencies shipped in the runtime image"
          fi

          echo "healthy; unauthenticated requests refused; credentialed ones accepted; no baked credential; non-root"
          docker rm -f smoke

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image:
    name: Publish image → ghcr.io
    needs: image-build
    runs-on: ubuntu-26.04
    environment: release
    # One manifest push per tag. The dispatch escape hatch can re-run a
    # release that already shipped, and a half-written manifest list is worse
    # than a late one.
    concurrency:
      group: publish-image-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write # create the GitHub Release for the tag
      packages: write # push the manifest list
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `value=` pins what semver parses. On a tag push github.ref_name is
          # already `vX.Y.Z`; on a manual dispatch it would be the branch the
          # hatch was fired from, which parses to no version at all and would
          # publish an image tagged only `latest`.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `${{ env.IMAGE }}` is substituted at the workflow-expression level,
      # before the shell runs, leaving exactly one `%s` for printf to cycle
      # across the digest filenames that `*` expands to.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect image
        id: inspect
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          # The manifest-list digest is the one thing a deploy should pin —
          # `${IMAGE}@${DIGEST}` is immutable where a tag can be re-pushed.
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}

      # release-please has already created the release for this tag with the
      # changelog in it. Without append_body the action finds that release,
      # drops the draft it built, keeps the old body, and reports success —
      # which is how brain-db v0.1.0 shipped with no image coordinates at all.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Container image

            ```
            docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ```

            Digest-pinned (immutable) for deploy manifests:

            ```
            ${{ env.IMAGE }}@${{ steps.inspect.outputs.digest }}
            ```

            Multi-arch: `linux/amd64`, `linux/arm64`.

            Run it. The container holds no credential — each caller sends their
            own `Authorization: Bearer brain_…`, so one deployment serves every
            user at their own identity:

            ```
            docker run -p 3333:3333 \
              -e BRAIN_MCP_BACKEND_URL=https://api.arc-labs.ai \
              ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ```
