name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Builds last so a type error surfaces as a typecheck failure rather
      # than a confusing emit failure, and proves `dist/` — the only thing
      # `files` ships to npm — actually compiles.
      - name: Build
        run: npm run build
