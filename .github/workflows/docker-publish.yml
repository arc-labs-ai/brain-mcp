name: Docker publish

# Publishes the brain-mcp container image to GHCR. This is the artifact our
# own hosted MCP endpoint runs — the ECS service pins a tag published here —
# and the one a self-hoster runs in front of their own brain-edge. The npm
# package (`release.yml`) is the stdio story; this is the hosted one.
#
# GHCR and not ECR, deliberately: the deploy role's OIDC trust policy names
# only `api.arc-labs.ai` and `infra.arc-labs.ai`, so this repo cannot assume
# it and has no AWS identity to push with. GHCR authenticates with the job's
# own GITHUB_TOKEN — nothing to provision, nothing to rotate — and ECS pulls
# a public GHCR image without credentials.
#
# Runs only on version tags. Tag a release only from a commit that already
# passed `ci.yml`; this workflow builds and smoke-tests the image but does not
# re-run the unit suite.
#
# Each platform builds on its own native runner rather than cross-building
# arm64 under QEMU. The image is pure JavaScript so emulation would work, but
# native runners are free for public repos and keep `npm ci` honest about the
# platform-specific binaries npm resolves.

on:
  push:
    tags:
      - "v*"
  # Escape hatch, and not a hypothetical one: a tag pushed by release-please
  # under the default GITHUB_TOKEN does not raise a workflow-starting event
  # (GitHub's recursion guard), so the tag -> image chain can silently not
  # happen. It didn't for brain-db v0.1.0. This builds any existing tag
  # without deleting and re-pushing it — dispatch from `main` and the checkout
  # below runs the FIXED workflow against the TAG's source.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish (e.g. v0.3.0)"
        required: true
        type: string

# `packages: write` lets GITHUB_TOKEN push to GHCR; `contents: write` lets the
# merge job append image coordinates to the release.
permissions:
  contents: write
  packages: write

concurrency:
  group: docker-publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/brain-mcp

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          # On a tag push this is already the tag; on a manual dispatch
          # github.ref is the branch the hatch was fired from, so the tag the
          # operator named is what must be built.
          ref: ${{ inputs.tag || github.ref }}

      - name: Derive platform tag pair
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The merge job runs metadata-action too, but only to tag the manifest
      # LIST. Labels live in each platform image's own config, so they have to
      # be applied here or the published image carries none — in particular
      # `source`, which is what ties a package back to a commit.
      - name: Derive image labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # This image's whole reason for existing is that one deployment serves
      # many users and each arrives as themselves. That property lives in the
      # request path, not in the unit tests, so it is asserted here against
      # the artifact that is about to be published.
      #
      # The backend is pointed at the discard port: nothing in this job should
      # reach the network, and every assertion below is about what the server
      # does BEFORE it calls a backend.
      - name: Smoke-test the pushed image
        run: |
          set -euo pipefail
          IMG="${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
          echo "::group::starting $IMG"
          docker run -d --name smoke -p 3333:3333 \
            -e BRAIN_MCP_BACKEND_URL=http://127.0.0.1:9 \
            "$IMG"
          echo "::endgroup::"

          # The image declares its own HEALTHCHECK (curl /healthz), so waiting
          # on Docker's verdict proves curl is actually in the image. That is
          # not cosmetic: our ECS task definition hardcodes `curl -f` as the
          # container health check, and an image without curl fails every
          # probe and is killed and replaced forever, which reads as the app
          # being broken rather than as a missing package.
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke 2>/dev/null || echo missing)"
            [ "$status" = "healthy" ] && break
            if [ "$(docker inspect -f '{{.State.Status}}' smoke 2>/dev/null)" != "running" ]; then
              echo "::error title=Smoke test failed::container exited before becoming healthy"
              docker logs smoke; docker rm -f smoke; exit 1
            fi
            sleep 2
          done

          if [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" != "healthy" ]; then
            echo "::error title=Smoke test failed::never became healthy within 60s"
            docker inspect -f '{{range .State.Health.Log}}{{.Output}}{{end}}' smoke || true
            docker logs smoke; docker rm -f smoke; exit 1
          fi

          fail() { echo "::error title=Smoke test failed::$1"; docker logs smoke; docker rm -f smoke; exit 1; }

          # 1. /healthz is unauthenticated on purpose — a load balancer has no
          #    bearer to send. If this ever required one, every task would be
          #    marked unhealthy on deploy.
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3333/healthz)"
          [ "$code" = "200" ] || fail "/healthz returned $code, want 200"

          # 2. The guard. A request with no credential must be refused at the
          #    door, not served as somebody. This is the failure that would be
          #    invisible in production, because it looks exactly like success.
          out="$(curl -s -D - -o /tmp/body.json -X POST http://127.0.0.1:3333/mcp \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}')"
          grep -qiE '^HTTP/[0-9.]+ 401' <<<"$out" || fail "unauthenticated POST /mcp was not 401: $(head -1 <<<"$out")"
          grep -qi '^www-authenticate: *Bearer' <<<"$out" || fail "401 did not carry a WWW-Authenticate: Bearer challenge"
          grep -q 'Missing Authorization header' /tmp/body.json || fail "401 body did not explain the missing header"

          # 3. A credentialed request is accepted. `initialize` is answered by
          #    the server itself, so this isolates "the bearer is taken" from
          #    "the backend is reachable" — which, here, it deliberately isn't.
          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3333/mcp \
                  -H 'Authorization: Bearer brain_smoke_not_a_real_key' \
                  -H 'Content-Type: application/json' \
                  -H 'Accept: application/json, text/event-stream' \
                  -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}')"
          [ "$code" = "200" ] || fail "credentialed initialize returned $code, want 200"

          # 4. No credential is baked into the image. A key in ENV or in a
          #    layer would be ambient authority that survives every deploy.
          if docker inspect -f '{{json .Config.Env}}' "$IMG" | grep -q 'BRAIN_MCP_API_KEY'; then
            fail "the image bakes in BRAIN_MCP_API_KEY"
          fi
          if docker run --rm --entrypoint sh "$IMG" -c 'grep -rlI "brain_" /app/dist /app/package.json 2>/dev/null' | grep -q .; then
            fail "a literal brain_ credential appears in the shipped files"
          fi

          # 5. Not root, and no dev toolchain riding along in node_modules.
          uid="$(docker exec smoke id -u)"
          [ "$uid" != "0" ] || fail "container runs as root"
          if docker run --rm --entrypoint sh "$IMG" -c '[ -d /app/node_modules/typescript ] || [ -d /app/node_modules/vitest ]'; then
            fail "dev dependencies shipped in the runtime image"
          fi

          echo "healthy; unauthenticated requests refused; credentialed ones accepted; no baked credential; non-root"
          docker rm -f smoke

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `value=` pins what semver parses. On a tag push github.ref_name is
          # already `vX.Y.Z`; on a manual dispatch it would be the branch the
          # hatch was fired from, which parses to no version at all and would
          # publish an image tagged only `latest`.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `${{ env.IMAGE }}` is substituted at the workflow-expression level,
      # before the shell runs, leaving exactly one `%s` for printf to cycle
      # across the digest filenames that `*` expands to.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect image
        id: inspect
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          # The manifest-list digest is the one thing a deploy should pin —
          # `${IMAGE}@${DIGEST}` is immutable where a tag can be re-pushed.
          digest="$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ steps.meta.outputs.version }}

      # release-please has already created the release for this tag with the
      # changelog in it. Without append_body the action finds that release,
      # drops the draft it built, keeps the old body, and reports success —
      # which is how brain-db v0.1.0 shipped with no image coordinates at all.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Container image

            ```
            docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ```

            Digest-pinned (immutable) for deploy manifests:

            ```
            ${{ env.IMAGE }}@${{ steps.inspect.outputs.digest }}
            ```

            Multi-arch: `linux/amd64`, `linux/arm64`.

            Run it. The container holds no credential — each caller sends their
            own `Authorization: Bearer brain_…`, so one deployment serves every
            user at their own identity:

            ```
            docker run -p 3333:3333 \
              -e BRAIN_MCP_BACKEND_URL=https://api.arc-labs.ai \
              ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ```
